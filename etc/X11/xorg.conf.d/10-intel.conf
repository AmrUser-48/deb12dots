#
#FILE /etc/X11/xorg.conf.d/20-intel.confForce Intel DDX

Section "Device"
    Identifier "Intel Graphics"
    Driver "intel"
##    Option "AccelMethod" "sna"
##    Option "DRI" "crocus"
EndSection

