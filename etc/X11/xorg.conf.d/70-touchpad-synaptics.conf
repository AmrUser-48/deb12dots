Section "InputClass"
    Identifier "ALPS DualPoint touchpad - synaptics"
    MatchIsTouchpad "on"
    MatchProduct "AlpsPS/2 ALPS DualPoint TouchPad"
    Driver "synaptics"
    Option "TapAndDragGesture" "on"
    Option "TapButton1" "1"
    Option "RTCornerButton" "0"
    Option "RBCornerButton" "0"
    Option "SingleTapTimeout" "0"
    Option "FastTaps" "on"
    Option "PalmDetect" "off"
    Option "SingleTapTimeout" "0"
    Option "EmulateMidButtonTime" "1"
EndSection
